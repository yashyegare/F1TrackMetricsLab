server {
    # ${PORT} is filled in by the base image's docker-entrypoint (envsubst
    # over this template) at container start — Cloud Run sets PORT itself.
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;

    # Hashed, content-addressed build assets (Vite names these foo-<hash>.js)
    # can be cached hard: a new deploy means a new filename, no staleness risk.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a new deploy won't be picked up
    # until the cache expires — it's the one file whose content changes
    # without its filename changing.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: the app reads route state from query params today, but
    # this mirrors the existing vercel.json rewrite so any future path-based
    # route (or a hard refresh on a deep link) resolves to index.html instead
    # of a bare-nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
