<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0d0d0f"/>
  <!-- Toolbar -->
  <rect x="0" y="0" width="800" height="44" fill="rgba(16,16,18,0.95)" stroke="#1e1e22" stroke-width="0.5"/>
  <rect x="300" y="8" width="90" height="28" rx="8" fill="none"/>
  <text x="318" y="26" font-family="system-ui" font-size="11" fill="#7a7a80" font-weight="600">Side by Side</text>
  <rect x="400" y="8" width="90" height="28" rx="8" fill="#e10600"/>
  <text x="422" y="26" font-family="system-ui" font-size="11" fill="white" font-weight="600">Overlay</text>
  <!-- Race Pace toggle -->
  <rect x="620" y="8" width="90" height="28" rx="8" fill="linear-gradient(135deg, #e10600, #c40500)"/>
  <text x="632" y="26" font-family="system-ui" font-size="11" fill="white" font-weight="700">Race Pace</text>
  <!-- 3D Canvas -->
  <rect x="16" y="56" width="770" height="300" rx="10" fill="#0c0c0e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Track A ribbon (red) -->
  <polyline points="200,180 280,130 380,170 500,120 600,180 580,280 480,320 360,300 260,260 200,220" fill="none" stroke="#e10600" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Track B ribbon (blue) - slightly different shape -->
  <polyline points="220,190 300,140 400,160 520,110 610,170 590,270 490,310 370,290 270,250 220,210" fill="none" stroke="#00a3ff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Car dots with speed coloring -->
  <circle cx="380" cy="170" r="7" fill="#ff9200" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <circle cx="400" cy="160" r="7" fill="#ff5b00" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Start/finish markers -->
  <rect x="194" y="172" width="12" height="60" rx="2" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="0.5"/>
  <!-- Labels -->
  <text x="300" y="85" font-family="system-ui" font-size="14" fill="#e10600" font-weight="700">Circuit of the Americas</text>
  <text x="430" y="85" font-family="system-ui" font-size="11" fill="#6a6a70">vs</text>
  <text x="460" y="85" font-family="system-ui" font-size="14" fill="#00a3ff" font-weight="700">Baku City Circuit</text>
  <!-- Gap readout -->
  <text x="500" y="300" font-family="system-ui" font-size="12" fill="#22c55e" font-weight="700">+0.18s</text>
  <!-- Controls bar -->
  <rect x="16" y="370" width="770" height="44" rx="10" fill="rgba(12,12,14,0.95)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="28" y="380" width="50" height="24" rx="5" fill="rgba(255,255,255,0.06)"/>
  <text x="40" y="396" font-family="system-ui" font-size="10" fill="#8a8a90">Labels</text>
  <rect x="86" y="380" width="80" height="24" rx="5" fill="rgba(255,255,255,0.06)"/>
  <text x="96" y="396" font-family="system-ui" font-size="10" fill="#22c55e">Sync Active</text>
  <rect x="174" y="380" width="60" height="24" rx="5" fill="rgba(255,255,255,0.06)"/>
  <text x="184" y="396" font-family="system-ui" font-size="10" fill="#8a8a90">Sea Level</text>
  <!-- Info bar -->
  <rect x="16" y="424" width="770" height="30" rx="8" fill="rgba(14,14,16,0.85)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="30" y="444" font-family="system-ui" font-size="10" fill="#d0d0d4">27.2C air  44C track</text>
  <text x="200" y="444" font-family="system-ui" font-size="10" fill="#c8a000">Best theoretical: 1:32.158</text>
  <!-- Head-to-Head section -->
  <rect x="16" y="464" width="770" height="30" rx="8 8 0 0" fill="rgba(18,18,20,0.95)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <rect x="30" y="472" width="18" height="18" rx="4" fill="rgba(225,6,0,0.25)"/>
  <text x="52" y="484" font-family="system-ui" font-size="11" fill="#c8c8cc" font-weight="700">HEAD-TO-HEAD</text>
</svg>
