<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0d0d0f"/>
  <!-- Toolbar -->
  <rect x="0" y="0" width="800" height="44" fill="rgba(16,16,18,0.95)" stroke="#1e1e22" stroke-width="0.5"/>
  <rect x="300" y="8" width="110" height="28" rx="8" fill="#e10600"/>
  <text x="318" y="26" font-family="system-ui" font-size="11" fill="white" font-weight="600">Side by Side</text>
  <rect x="420" y="8" width="90" height="28" rx="8" fill="none"/>
  <text x="442" y="26" font-family="system-ui" font-size="11" fill="#7a7a80" font-weight="600">Overlay</text>
  <!-- Left 3D viewport -->
  <rect x="16" y="56" width="380" height="280" rx="12" fill="#0a0a0c" stroke="#e10600" stroke-width="1"/>
  <!-- Track ribbon - left -->
  <polyline points="80,200 140,150 220,180 300,140 340,220 300,280 220,300 140,260 80,240" fill="none" stroke="#e10600" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- Speed coloring dots -->
  <circle cx="140" cy="150" r="3" fill="#ff5b00"/>
  <circle cx="300" cy="140" r="3" fill="#ff3700"/>
  <circle cx="220" cy="300" r="3" fill="#3737c8"/>
  <circle cx="340" cy="220" r="3" fill="#c8c837"/>
  <!-- Car dot -->
  <circle cx="220" cy="180" r="6" fill="#ffff00"/>
  <!-- Right 3D viewport -->
  <rect x="408" y="56" width="380" height="280" rx="12" fill="#0a0a0c" stroke="#00a3ff" stroke-width="1"/>
  <!-- Track ribbon - right -->
  <polyline points="480,220 540,180 620,200 700,160 720,240 680,300 600,310 520,280 480,250" fill="none" stroke="#00a3ff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- Speed coloring dots -->
  <circle cx="540" cy="180" r="3" fill="#ff5b00"/>
  <circle cx="700" cy="160" r="3" fill="#ff3700"/>
  <circle cx="600" cy="310" r="3" fill="#3737c8"/>
  <!-- Car dot -->
  <circle cx="620" cy="200" r="6" fill="#ffff00"/>
  <!-- Captions -->
  <text x="206" y="355" font-family="system-ui" font-size="11" fill="#8a8a90" text-anchor="middle">Circuit of the Americas</text>
  <text x="602" y="355" font-family="system-ui" font-size="11" fill="#8a8a90" text-anchor="middle">Baku City Circuit</text>
  <!-- Speed legend -->
  <rect x="260" y="380" width="280" height="40" rx="10" fill="rgba(18,18,20,0.9)" stroke="#222226" stroke-width="1"/>
  <text x="280" y="396" font-family="system-ui" font-size="8" fill="#6a6a70" font-weight="700">RIBBON SPEED</text>
  <rect x="280" y="402" width="240" height="6" rx="3" fill="url(#speedGrad)"/>
  <defs>
    <linearGradient id="speedGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3737c8"/>
      <stop offset="50%" stop-color="#ffff00"/>
      <stop offset="100%" stop-color="#ff0900"/>
    </linearGradient>
  </defs>
  <text x="280" y="418" font-family="system-ui" font-size="8" fill="#5a5a60">80</text>
  <text x="392" y="418" font-family="system-ui" font-size="8" fill="#5a5a60">160</text>
  <text x="504" y="418" font-family="system-ui" font-size="8" fill="#5a5a60">240</text>
  <text x="506" y="418" font-family="system-ui" font-size="8" fill="#5a5a60">320 km/h</text>
</svg>
