<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0d0d0f"/>
  <rect x="0" y="0" width="240" height="500" fill="#141416"/>
  <rect x="0" y="0" width="240" height="3" fill="#e10600"/>
  <!-- Sidebar nav -->
  <rect x="16" y="50" width="100" height="28" rx="6" fill="#e10600"/>
  <text x="38" y="68" font-family="system-ui" font-size="11" fill="white" font-weight="600">Home</text>
  <rect x="124" y="50" width="96" height="28" rx="6" fill="none"/>
  <text x="142" y="68" font-family="system-ui" font-size="11" fill="#7a7a80" font-weight="600">Map</text>
  <!-- Search -->
  <rect x="16" y="100" width="208" height="36" rx="10" fill="#0e0e11" stroke="#222226" stroke-width="1"/>
  <text x="36" y="122" font-family="system-ui" font-size="11" fill="#4a4a50">Search circuits or cities...</text>
  <!-- Circuit list -->
  <text x="16" y="165" font-family="system-ui" font-size="9" fill="#5a5a60" font-weight="700">CIRCUITS 40</text>
  <text x="16" y="190" font-family="system-ui" font-size="12" fill="#a0a0a6">Albert Park Circuit</text>
  <text x="16" y="204" font-family="system-ui" font-size="10" fill="#666">Melbourne</text>
  <text x="16" y="230" font-family="system-ui" font-size="12" fill="#e0e0e4" font-weight="600">Circuit of the Americas</text>
  <text x="16" y="244" font-family="system-ui" font-size="10" fill="#666">Austin</text>
  <!-- Map area -->
  <rect x="260" y="16" width="524" height="468" rx="8" fill="#1a2a1a"/>
  <!-- Track outline -->
  <polyline points="340,200 400,180 500,220 580,200 620,280 580,340 500,360 400,340 340,300 320,240" fill="none" stroke="#e10600" stroke-width="4" stroke-linecap="round"/>
  <!-- Lap marker dot -->
  <circle cx="340" cy="200" r="8" fill="#e10600"/>
  <circle cx="340" cy="200" r="4" fill="white"/>
  <!-- Info panel -->
  <rect x="560" y="20" width="220" height="120" rx="10" fill="rgba(20,20,22,0.92)" stroke="#26262a" stroke-width="1"/>
  <text x="576" y="48" font-family="system-ui" font-size="14" fill="#f2f2f2" font-weight="700">Circuit of the Americas</text>
  <text x="576" y="66" font-family="system-ui" font-size="11" fill="#8a8a90">Austin, Texas</text>
  <text x="576" y="90" font-family="system-ui" font-size="9" fill="#5a5a5e">LENGTH</text>
  <text x="576" y="104" font-family="system-ui" font-size="13" fill="#e8e8ec" font-weight="700">5.514 km</text>
  <text x="660" y="90" font-family="system-ui" font-size="9" fill="#5a5a5e">CORNERS</text>
  <text x="660" y="104" font-family="system-ui" font-size="13" fill="#e8e8ec" font-weight="700">12</text>
  <text x="576" y="128" font-family="system-ui" font-size="9" fill="#5a5a5e">ALTITUDE</text>
  <text x="576" y="140" font-family="system-ui" font-size="13" fill="#e8e8ec" font-weight="700">130 m</text>
</svg>
