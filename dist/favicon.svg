<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="#0d0d0f" stroke="#e10600" stroke-width="1.5"/>
  <!-- Stylized track outline -->
  <path d="M8 22 C8 10, 16 6, 24 10 C28 12, 26 18, 20 20 C16 21, 12 20, 8 22Z" 
        fill="none" stroke="#e10600" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Racing dot -->
  <circle cx="24" cy="10" r="2.5" fill="#ffcc00">
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>
